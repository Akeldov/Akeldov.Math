<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Akeldov.Math.Hexes Documentation</title>
  <script>
    const marker = '/Hexes/';
    const markerIndex = window.location.pathname.indexOf(marker);
    const currentRoot = window.location.pathname.substring(0, markerIndex + 1);
    const languageRoot = currentRoot.endsWith('/en/') || currentRoot.endsWith('/ru/')
      ? currentRoot
      : `${currentRoot}en/`;
    const target = new URL(
      `${languageRoot}Hexes/latest/index.html`,
      window.location.origin);
    target.search = window.location.search;
    target.hash = window.location.hash;
    window.location.replace(target);
  </script>
</head>
<body>
  <p>Opening the latest Hexes documentation.</p>
</body>
</html>
