name: Publish Spatial2D to NuGet

on:
  push:
    tags:
      - spatial2d/v*
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_PATH: src/Akeldov.Math.Spatial2D/Akeldov.Math.Spatial2D.csproj
  TEST_PROJECT_PATH: tests/Akeldov.Math.Spatial2D.Tests/Akeldov.Math.Spatial2D.Tests.csproj
  TEST_ASSEMBLY_PATH: tests/Akeldov.Math.Spatial2D.Tests/bin/Debug/net6.0/Akeldov.Math.Spatial2D.Tests.dll
  PACKAGE_OUTPUT_PATH: artifacts/packages
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  publish:
    name: Publish Akeldov.Math.Spatial2D
    runs-on: windows-latest
    environment: nuget.org

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            9.0.x

      - name: Show .NET info
        shell: pwsh
        run: dotnet --info

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore $env:PROJECT_PATH
          dotnet restore $env:TEST_PROJECT_PATH

      - name: Build tests
        shell: pwsh
        run: >
          dotnet build $env:TEST_PROJECT_PATH
          --framework net6.0
          --no-restore
          --disable-build-servers
          /maxcpucount:1

      - name: Run tests
        shell: pwsh
        run: >
          dotnet vstest $env:TEST_ASSEMBLY_PATH
          "--logger:console;verbosity=detailed"

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content $env:PROJECT_PATH
          $packageVersion = @($project.Project.PropertyGroup.Version | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })[0]

          if ([string]::IsNullOrWhiteSpace($packageVersion)) {
            throw "Could not read <Version> from $env:PROJECT_PATH."
          }

          if ($packageVersion -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "Package version '$packageVersion' does not look like a valid NuGet SemVer version."
          }

          $expectedTag = "spatial2d/v$packageVersion"

          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -cne $expectedTag) {
            throw "Publish from the '$expectedTag' tag, not '$($env:GITHUB_REF)'."
          }

          $tagType = git cat-file -t $env:GITHUB_REF
          if ($LASTEXITCODE -ne 0 -or $tagType.Trim() -ne 'tag') {
            throw "The '$expectedTag' release tag must be annotated."
          }

          $tagCommit = (git rev-list -n 1 $env:GITHUB_REF).Trim()
          $checkedOutCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $checkedOutCommit) {
            throw "The '$expectedTag' tag does not identify the checked-out commit."
          }

          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT
          "PACKAGE_VERSION=$packageVersion" >> $env:GITHUB_ENV

      - name: Build package
        shell: pwsh
        run: >
          dotnet build $env:PROJECT_PATH
          --configuration Release
          --no-restore
          --disable-build-servers
          /p:PackageVersion=$env:PACKAGE_VERSION
          /p:ContinuousIntegrationBuild=true
          /p:IncludeSourceRevisionInInformationalVersion=false
          /maxcpucount:1

      - name: Pack
        shell: pwsh
        run: >
          dotnet pack $env:PROJECT_PATH
          --configuration Release
          --no-build
          --output $env:PACKAGE_OUTPUT_PATH
          /p:PackageVersion=$env:PACKAGE_VERSION
          /p:ContinuousIntegrationBuild=true
          /p:IncludeSourceRevisionInInformationalVersion=false

      - name: Verify release candidate
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem $env:PACKAGE_OUTPUT_PATH -Filter "*.nupkg")
          if ($packages.Count -ne 1) {
            throw "Expected exactly one generated NuGet package, but found $($packages.Count)."
          }

          $packageName = "Akeldov.Math.Spatial2D.$($env:PACKAGE_VERSION).nupkg"
          if ($packages[0].Name -cne $packageName) {
            throw "Expected package '$packageName', but found '$($packages[0].Name)'."
          }

          $candidatePath = Join-Path `
            "docfx/versioned/Spatial2D/$($env:PACKAGE_VERSION)/source" `
            $packageName
          if (-not (Test-Path -LiteralPath $candidatePath -PathType Leaf)) {
            throw "The immutable release candidate is missing: $candidatePath"
          }

          $candidateHash = (Get-FileHash $candidatePath -Algorithm SHA256).Hash

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $generatedArchive = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          $candidateArchive = [System.IO.Compression.ZipFile]::OpenRead(
            (Resolve-Path $candidatePath))

          try {
            $payloadPaths = @(
              'Akeldov.Math.Spatial2D.nuspec',
              'lib/net6.0/Akeldov.Math.Spatial2D.dll',
              'lib/net6.0/Akeldov.Math.Spatial2D.xml',
              'lib/netstandard2.1/Akeldov.Math.Spatial2D.dll',
              'lib/netstandard2.1/Akeldov.Math.Spatial2D.xml',
              'README.md')

            foreach ($payloadPath in $payloadPaths) {
              $generatedEntry = $generatedArchive.GetEntry($payloadPath)
              $candidateEntry = $candidateArchive.GetEntry($payloadPath)
              if ($null -eq $generatedEntry -or $null -eq $candidateEntry) {
                throw "Required package payload is missing: $payloadPath"
              }

              $generatedStream = $generatedEntry.Open()
              $candidateStream = $candidateEntry.Open()
              $sha256 = [System.Security.Cryptography.SHA256]::Create()
              try {
                $generatedHash = ([BitConverter]::ToString(
                  $sha256.ComputeHash($generatedStream))).Replace('-', '')
                $candidateHashForEntry = ([BitConverter]::ToString(
                  $sha256.ComputeHash($candidateStream))).Replace('-', '')
              } finally {
                $sha256.Dispose()
                $generatedStream.Dispose()
                $candidateStream.Dispose()
              }

              if ($generatedHash -cne $candidateHashForEntry) {
                throw "Generated payload does not match the release candidate: $payloadPath"
              }
            }
          } finally {
            $generatedArchive.Dispose()
            $candidateArchive.Dispose()
          }

          "CANDIDATE_PACKAGE_PATH=$((Resolve-Path $candidatePath).Path)" >> $env:GITHUB_ENV
          "Spatial2D $($env:PACKAGE_VERSION) SHA-256: $candidateHash" >> $env:GITHUB_STEP_SUMMARY

      - name: Publish to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw "Repository or environment secret NUGET_API_KEY is required."
          }

          dotnet nuget push $env:CANDIDATE_PACKAGE_PATH `
            --api-key $env:NUGET_API_KEY `
            --source $env:NUGET_SOURCE
